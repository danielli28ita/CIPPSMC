reference_generator:
  ros__parameters:
    hover_altitude_m: 5.0
    # Timeline (command_start = first EKF local position):
    #   0–5 s: silent (no setpoint)
    #   5 s+: publish setpoint; hold current pose until ARM
    #   after ARM: climb setpoint to hover_altitude_m (z = -5 NED)
    #   arm+9 s: figure-8 (≈ old command+15 with arm@command+6)
    #   arm+80 s: return + land
    silent_duration_s: 5.0
    hover_duration_s: 10.0
    figure8_start_command_s: 15.0
    figure8_start_after_arm_s: 9.0
    climb_after_arm_s: 1.0
    hold_pose_until_arm: true
    mission_end_after_arm_s: 80.0
    return_origin_timeout_s: 8.0
    return_origin_arrival_radius_m: 1.5
    figure8_a: 3.0
    figure8_omega: 0.2
    force_figure8_timeout_s: 30.0
    auto_offboard_arm: true
    control_rate_hz: 100.0
    use_acceleration_feedforward: true
    use_fixed_anchor: true
    anchor_x_m: 0.0
    anchor_y_m: 0.0
    arm_after_command_s: 6.0
    topic.offboard_control_mode: "/fmu/in/offboard_control_mode"
    topic.trajectory_setpoint: "/fmu/in/trajectory_setpoint"
    topic.vehicle_command: "/fmu/in/vehicle_command"
    topic.vehicle_status: "/fmu/out/vehicle_status"
    topic.vehicle_local_position: "/fmu/out/vehicle_local_position"
