# Benchmark mission for controller comparison (PID / BPPSMC / ET-ADRC / FxT-OF).
# Design rationale (2026-07-11, see BPPSMC/BPPSMC项目管理.html §轨迹设计):
#   1. Transient test: hard -5 m Z step at arm (spawn-relative, anchor settle-latched)
#      -> exercises prescribed/fixed-time convergence claims with identical e_z(0)≈5 m.
#   2. Steady tracking test: Bernoulli figure-8, a=3 m, omega=0.5 rad/s
#      -> peak v_xy=1.50 m/s, peak a_xy=2.25 m/s2 (6x the legacy omega=0.2 excitation).
#   3. Dynamic Z test: vertical sinusoid amp=0.5 m at 2*omega (1.0 rad/s)
#      -> peak v_z=0.5 m/s, a_z=0.5 m/s2; Z tracking is no longer a constant-hold task.
# Feasibility: all peaks well below shared controller acc limits {6,6,10} m/s2 and PID
#   capability (tilt ~13 deg) with >2.5x margin -> no asymmetric saturation, fair for all.
reference_generator:
  ros__parameters:
    hover_altitude_m: 5.0
    silent_duration_s: 0.0
    hold_pose_until_arm: false
    climb_after_arm_s: 0.0
    climb_ramp_duration_s: 0.0
    use_fixed_arm_latch_z: false
    use_fixed_anchor: false
    anchor_from_spawn: true
    anchor_settle_s: 2.0
    anchor_settle_tol_m: 0.05
    anchor_settle_max_s: 10.0
    auto_offboard_arm: true
    figure8_start_command_s: 15.0
    figure8_a: 3.0
    figure8_omega: 0.5
    figure8_z_amp_m: 0.5
    figure8_z_omega_scale: 2.0
    arm_after_command_s: 6.0
    mission_end_after_arm_s: 80.0
    use_acceleration_feedforward: true
